<html>
  <head>
    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <meta charset="UTF-8">
    <title>Live Stream Player</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
      }
      .player-container {
        position: relative;
        width: 100%;
        background: black;
      }
      #jwplayerDiv {
        width: 100%;
        height: 100%;
        aspect-ratio: 16/9; /* keeps video ratio */
      }
      /* Tiny Watermark */
      .watermark {
        position: absolute;
        top: 6px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 3px;
        color: rgba(255,255,255,0.75);
        font-size: 10px;
        font-weight: bold;
        z-index: 9999;
        text-decoration: none;
        background: rgba(0,0,0,0.4);
        padding: 2px 5px;
        border-radius: 3px;
        user-select: none;
      }
      .watermark img {
        width: 12px;
        height: 12px;
      }
      .watermark:hover {
        background: rgba(0,0,0,0.6);
      }
      /* Telegram Join Box */
      .telegram-box {
        width: 100%;
        text-align: center;
        background: #1c1c1c;
        padding: 14px;
        margin-top: 0;
        box-sizing: border-box;
      }
      .telegram-box a {
        display: inline-block;
        background: #0088cc;
        color: #fff;
        text-decoration: none;
        padding: 9px 16px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.3s;
      }
      .telegram-box a:hover {
        background: #006b99;
      }
    </style>
  </head>

  <body>
    <div class="player-container">
      <div id="jwplayerDiv"></div>

      <!-- Tiny Clickable Watermark -->
      <a class="watermark" href="https://t.me/cricmatchstream" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG">
        @CRICMATCHSTREAM
      </a>
    </div>

    <!-- Telegram Join Box -->
    <div class="telegram-box">
      <a href="https://t.me/cricmatchstream" target="_blank">JOIN TELEGRAM FOR MORE LIVE LINKS</a>
    </div>

    <script type="text/javascript">
      jwplayer("jwplayerDiv").setup({
        autostart: true,
        preload: "auto",
        repeat: true,
        width: "100%",
        aspectratio: "16:9",
        file: "https://qwrvdz-veto.akamaized.net/f98c8ae68a354ab59a4e28e3dd700d4f/playlist.m3u8?session_id=aefd63ba-f810-4b5b-b88b-1cd135206342-1793260264960",
        type: "hls"
      });function welcome() {
        window.open("https://t.me/cricmatchstream");
      }
        const message = "JOIN OUR TELEGRAM CHANNEL FOR MORE LIVE STREAM LINKS";
        if (confirm(message)) {
            window.location.href = "https://t.me/cricmatchstream";
        }

    </script>
  </body>
</html>
</html>
